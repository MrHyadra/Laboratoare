<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Bec cu contor</title>
<script>
var contor = 0;   // in afara functiei, ca sa isi pastreze valoarea intre clicuri

function schimbaBec() {
    var bec = document.getElementById("bec");
    // src contine adresa completa, cu "Bec%20aprins.gif"; cautam doar cuvantul "aprins"
    if (bec.src.indexOf("aprins") !== -1) {
        bec.src = "Bec stins.gif";
    } else {
        bec.src = "Bec aprins.gif";
        contor = contor + 1;
        document.getElementById("rezultat").innerHTML = "Becul a fost aprins de " + contor + " ori.";
    }
}
</script>
</head>
<body>

<h1>Bec cu contor</h1>

<img id="bec" src="Bec stins.gif" width="100" height="180" onclick="schimbaBec()">

<p id="rezultat">Becul a fost aprins de 0 ori.</p>

<p>Clic pe bec pentru a-l aprinde sau stinge.</p>

</body>
</html>
